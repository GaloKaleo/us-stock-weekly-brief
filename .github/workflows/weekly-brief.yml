name: 美股周报（每周一早晨）

on:
  schedule:
    # GitHub 的 cron 使用 UTC。00:00 UTC = 北京时间 08:00（夏令时期间同为 08:00，因为中国不实行夏令时）
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只生成报告、不推送（调试用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-us-stock-brief
  cancel-in-progress: false

jobs:
  brief:
    name: 采集 · 解读 · 推送
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成并推送周报
        env:
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # 自选股新闻的数据源。
          # 主力是 SeekingAlpha 个股 RSS（免费、无需 key）；Marketaux 只在 SeekingAlpha
          # 没覆盖到的代码上做补充，并负责「SK hynix / HBM」这类关键词检索（免费档 30 次/天）。
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          # Tiingo 当前未使用：免费套餐不含 News API（返回 403），此处仅为将来备用
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

          # 群机器人：填哪个就推哪个，留空的自动跳过
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

          # 可选渠道
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

          # 每个渠道的内容长度：short = 精简版（要点速览+关键日期+财报，约 1.6KB 一条发完）
          #                       full  = 完整版（含 AI 全文解读）
          # 留空则使用 config/default.json 里的默认值（企业微信默认 short，其余默认 full）。
          # 想临时切换又不想改代码：仓库 Settings → Secrets and variables → Actions → Variables
          WECOM_MODE: ${{ vars.WECOM_MODE }}
          DINGTALK_MODE: ${{ vars.DINGTALK_MODE }}
          FEISHU_MODE: ${{ vars.FEISHU_MODE }}
          SERVERCHAN_MODE: ${{ vars.SERVERCHAN_MODE }}
          PUSHPLUS_MODE: ${{ vars.PUSHPLUS_MODE }}

          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node src/main.mjs

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-stock-brief-${{ github.run_number }}
          path: |
            out/latest.md
            out/latest.html
            out/*.md
            out/*.html
            out/raw-data.json
          retention-days: 90

      - name: 失败时在 Summary 中标注
        if: failure()
        run: echo "## ❌ 本次运行失败，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
